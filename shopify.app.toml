# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "739c684d06d4d20426038a5096c78a47"
name = "QuizInsights"
handle = "quizinsights"
application_url = "https://quizinsights.galaxyweblinks.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_files"

[auth]
redirect_urls = [ "https://quizinsights.galaxyweblinks.com/api/auth" ]

[app_proxy]
url = "https://quizinsights.galaxyweblinks.com"
subpath = "quizapp"
prefix = "apps"

[pos]
embedded = false

[sidekick]
extensions_summary = "Search QuizInsights quizzes and responses, view quiz performance analytics, and open quizzes in the customizer"
